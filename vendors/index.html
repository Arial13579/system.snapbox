<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F8F7">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d9488'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Arial'%3E%E2%82%AA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="vendor.css">
<title>כניסת ספקים | מחולל הצעות מחיר</title>
</head>
<body>
<header class="bar"><div class="in"><a class="brand" href="../"><span class="brand-mark">₪</span>מחולל הצעות מחיר</a></div></header>
<main class="wrap">
  <section class="gate card">
    <div class="card-b">
      <h1>כניסת ספקים</h1>
      <p id="msg">מתחברים עם חשבון הגוגל שנרשם אצלנו, ומגיעים ישר לחשבון העסק שלכם.</p>
      <button type="button" class="btn primary lg" id="signin" disabled>טוען…</button>
      <p class="err hidden" id="err"></p>
      <button type="button" class="link hidden" id="other">התחברות עם חשבון אחר</button>
    </div>
  </section>
</main>
<script src="platform.js"></script>
<script src="core.js"></script>
<script>
(async () => {
    const $ = id => document.getElementById(id);
    const btn = $('signin');
    const showErr = t => { $('err').textContent = t; $('err').classList.remove('hidden'); };
    try { await Core.fb(); } catch(e) { showErr('טעינת המערכת נכשלה. רעננו את הדף.'); return; }
    btn.innerHTML = Core.GOOGLE_SVG + ' התחברות עם Google';
    btn.disabled = false;
    btn.addEventListener('click', async () => {
        try { await Core.signIn(); }
        catch(e) { if (e.code !== 'auth/popup-closed-by-user') showErr('ההתחברות נכשלה: ' + (e.code || e.message)); }
    });
    $('other').addEventListener('click', () => Core.signOut());

    Core.onAuth(async user => {
        if (!user) return;
        btn.disabled = true; btn.textContent = 'מתחבר…';
        if (Core.isOwner(user)) { location.replace('admin.html'); return; }
        const slug = await Core.tenantOf(user);
        if (slug) { location.replace('app.html?t=' + encodeURIComponent(slug)); return; }
        btn.classList.add('hidden');
        showErr('החשבון ' + user.email + ' לא רשום כספק במערכת, או שהחשבון מושהה.');
        $('msg').textContent = 'אם נרשמתם עם כתובת Gmail אחרת, התחברו איתה.';
        $('other').classList.remove('hidden');
    });
})();
</script>
</body>
</html>
