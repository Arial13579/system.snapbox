<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F3F8F7">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d9488'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Arial'%3E%E2%82%AA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Secular+One&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="vendor.css">
<title>החשבון שלי | מחולל הצעות מחיר</title>
</head>
<body>
<header class="bar"><div class="in">
  <a class="brand" href="../"><span class="brand-mark">₪</span>מחולל הצעות מחיר</a>
  <div class="who"><span id="user-email"></span><button type="button" class="btn sm" id="signout">התנתקות</button></div>
</div></header>

<main class="wrap">
  <p class="loading" id="loading">טוען את החשבון…</p>
  <section class="gate card hidden" id="blocked"><div class="card-b"><h1>אין גישה</h1><p id="blocked-msg"></p><a class="btn" href="./">חזרה לכניסה</a></div></section>

  <div id="main" class="hidden">
    <div class="owner-banner hidden" id="owner-banner"><span>מצב בעלים · אתה צופה בחשבון של <b id="ob-name"></b></span><a class="btn sm" href="admin.html">חזרה ללוח הניהול</a></div>
    <div class="tenant-head"><span class="tlogo" id="t-logo"></span><div><h1 id="t-name"></h1><p id="t-tag"></p></div></div>
    <div class="tabs" role="tablist">
      <button type="button" class="on" data-tab="new" role="tab">הצעה חדשה</button>
      <button type="button" data-tab="dash" role="tab">לוח בקרה</button>
    </div>

    <!-- ===== הצעה חדשה ===== -->
    <section id="tab-new" class="card">
      <div class="card-b">
        <form id="creator-form" class="grid2" autocomplete="off">
          <div><label class="lbl" for="in_clientName">לכבוד (שם הלקוח) *</label><input type="text" id="in_clientName" required class="field" placeholder="שם מלא / חברה"></div>
          <div><label class="lbl" for="in_eventType">סוג האירוע *</label><input type="text" id="in_eventType" required class="field" list="event-types" placeholder="למשל חתונה"><datalist id="event-types"></datalist></div>
          <div class="span2"><label class="lbl" for="in_service" id="lbl-service">חבילה *</label><select id="in_service" class="field" required></select></div>
          <div><label class="lbl" for="in_location">מיקום האירוע *</label><input type="text" id="in_location" required class="field" placeholder="שם המקום, עיר"></div>
          <div><label class="lbl" for="in_date">תאריך האירוע *</label><input type="text" id="in_date" required class="field ltr" style="text-align:left" inputmode="numeric" maxlength="10" placeholder="DD/MM/YYYY"></div>
          <div><label class="lbl" for="in_startTime">שעת התחלה *</label><input type="text" id="in_startTime" required class="field ltr" style="text-align:left" inputmode="numeric" maxlength="5" placeholder="HH:MM"></div>
          <div><label class="lbl" for="in_endTime">שעת סיום *</label><input type="text" id="in_endTime" required class="field ltr" style="text-align:left" inputmode="numeric" maxlength="5" placeholder="HH:MM"></div>
          <div><label class="lbl" for="in_guests">כמות מוזמנים (משוער) *</label><input type="number" id="in_guests" required min="1" class="field" placeholder="למשל 250"></div>
          <div><label class="lbl" for="in_distance">מרחק נסיעה (ק"מ) <small>· מחושב אוטומטית</small></label><input type="number" id="in_distance" min="0" class="field" placeholder="0"><p id="distance-status" class="hint"></p></div>
          <div id="price-breakdown" class="breakdown span2 hidden"></div>
          <div><label class="lbl" for="in_price">מחיר כולל (₪) * <small>· מחושב, ניתן לעריכה</small></label><input type="number" id="in_price" required class="field"></div>
          <div><label class="lbl" for="in_deposit">מקדמה (₪)</label><input type="number" id="in_deposit" class="field"></div>
          <div class="span2"><label class="lbl" for="in_notes">הערות / סיכומים <small>· אופציונלי</small></label><textarea id="in_notes" rows="2" class="field"></textarea></div>
          <button type="submit" class="btn primary lg block span2" id="gen-btn">צור קישור ללקוח</button>
        </form>
        <div id="link-result" class="result hidden">
          <b>✓ הקישור מוכן — נפתח ישירות בהצעת המחיר</b>
          <div class="row"><input type="text" id="shareable-url" readonly dir="ltr" class="field"><button type="button" id="copy-btn" class="btn sm">העתק</button></div>
          <div class="row"><a id="wa-share-btn" href="#" target="_blank" rel="noopener" class="btn wa block">שליחה ללקוח בוואטסאפ</a><a id="preview-btn" href="#" target="_blank" rel="noopener" class="btn">תצוגה</a></div>
        </div>
      </div>
    </section>

    <!-- ===== לוח בקרה ===== -->
    <section id="tab-dash" class="hidden">
      <div class="kpis" id="kpis"></div>
      <div class="charts">
        <div class="card"><div class="card-h"><h2>סטטוס הצעות</h2></div><div class="card-b"><div class="chart-box"><canvas id="statusChart"></canvas></div></div></div>
        <div class="card"><div class="card-h"><h2>הכנסות לפי חודש האירוע (חתומות)</h2></div><div class="card-b"><div class="chart-box"><canvas id="revenueChart"></canvas></div></div></div>
      </div>
      <div class="toolbar">
        <input type="text" id="search" class="field" placeholder="חיפוש לפי לקוח / סוג אירוע…">
        <div class="seg" id="statusSeg"><button type="button" data-v="all" class="on">הכל</button><button type="button" data-v="pending">ממתינות</button><button type="button" data-v="signed">נחתמו</button></div>
      </div>
      <div class="card tbl-wrap">
        <table>
          <thead><tr><th>נשלח</th><th>לקוח</th><th>אירוע</th><th id="th-service">חבילה</th><th>תאריך אירוע</th><th>מחיר</th><th>סטטוס</th><th>קובץ</th><th>פעולות</th></tr></thead>
          <tbody id="tbody"><tr><td colspan="9" class="loading">טוען נתונים…</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<input type="file" id="fileUploadInput" accept="application/pdf" style="display:none">

<script src="platform.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
